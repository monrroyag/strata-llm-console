name: Publish Linux package

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  packages: write

env:
  IMAGE: ghcr.io/monrroyag/strata-llm-console

jobs:
  quality:
    name: Validate source and Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test Python
        run: |
          python -m py_compile *.py
          python -m unittest -v
      - name: Validate frontend and packaging scripts
        run: |
          node --check web/app.js
          node --check web/i18n.js
          bash -n packaging/*.sh
          python -m json.tool catalog.json >/dev/null
          python -m json.tool data/params_help.json >/dev/null
          python -m json.tool docs/api/openapi.json >/dev/null
          VERSION=0.0.0~ci OUT=dist-deb bash packaging/build-deb.sh
          dpkg-deb --info dist-deb/*.deb >/dev/null
      - name: Build and inspect bundle
        run: |
          chmod +x packaging/build-linux-package.sh
          VERSION=ci ./packaging/build-linux-package.sh
          sha256sum -c dist/*.sha256
          tar -tzf dist/*.tar.gz | grep -q '/data/params_help.json'
          tar -tzf dist/*.tar.gz | grep -q '/docs/api/openapi.json'
          ! tar -tzf dist/*.tar.gz | grep -E '(^|/)(token|.*\.gguf|traces\.jsonl)$'

  linux-bundle:
    needs: quality
    name: Build and publish Linux bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build reproducible Linux archive
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          chmod +x packaging/build-linux-package.sh
          VERSION="${VERSION#v}" ./packaging/build-linux-package.sh
          VERSION="${VERSION#v}" OUT=dist-deb bash packaging/build-deb.sh
          chmod +x packaging/install-linux.sh
          cp packaging/install-linux.sh dist/install-linux.sh
          deb_name="$(basename "$(find dist-deb -maxdepth 1 -name '*.deb' -print -quit)")"
          cp "dist-deb/$deb_name" "dist/$deb_name"
          (cd dist && sha256sum "$deb_name" > "$deb_name.sha256")
          sha256sum dist/install-linux.sh > dist/install-linux.sh.sha256
      - name: Create GitHub release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "Strata LLM Console ${GITHUB_REF_NAME}" \
            --generate-notes

  container-package:
    needs: quality
    name: Publish OCI package to GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push package
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.title=Strata LLM Console
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Local Strata control plane and OpenAI-compatible gateway

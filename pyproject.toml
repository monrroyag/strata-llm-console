[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "strata-llm-console"
version = "0.3.1"
description = "Local Strata control plane, gateway and operations CLI"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
strata-console = "cli:main"

[tool.setuptools]
py-modules = [
  "backend_core", "cli", "connection_core", "console_core", "console_server",
  "evaluation_core", "history_core", "job_core", "optimize_core", "runtime_drivers",
  "state_store", "telegram_control_bot", "trace_core", "tunnel_core", "update_core",
  "update_monitor"
]
